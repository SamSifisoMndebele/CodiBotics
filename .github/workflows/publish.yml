name: Publish to PyPI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pulsemaker-simulator
    permissions:
      contents: read
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tool
        run: python -m pip install --upgrade build

      - name: Build binary wheel and source tarball
        run: |
          if [ -f "./pyproject.toml" ]; then
            echo "Building from root directory..."
            python -m build .
            echo "DIST_DIR=dist/" >> $GITHUB_ENV
          else
            echo "Building from python/ directory..."
            python -m build python/
            echo "DIST_DIR=python/dist/" >> $GITHUB_ENV
          fi

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ env.DIST_DIR }}
          skip-existing: true
