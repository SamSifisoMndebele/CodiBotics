[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codibotics"
version = "1.0.0"
description = "Python and MicroPython runtime library for CodiBotics Simulator (DBE CAPS Coding & Robotics)"
readme = "README.md"
authors = [{ name = "CodiBotics Simulator Team" }]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["robotics", "simulator", "micropython", "education", "stem", "caps"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.scripts]
codibotics = "codibotics.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codibotics*", "codibotics_rover*"]
